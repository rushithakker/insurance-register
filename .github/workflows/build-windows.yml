name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --name InsuranceRegister launcher.py

      - name: Prepare package
        run: |
          mkdir package
          copy dist\InsuranceRegister.exe package\
          copy app.py package\
          copy insurance.db package\
          mkdir package\backups

      - name: Upload EXE Package
        uses: actions/upload-artifact@v4
        with:
          name: InsuranceRegister-Windows
          path: package/
